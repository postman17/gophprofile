{{define "layout"}}<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
:root{--bg:#0f1218;--card:#171c25;--line:#252c39;--text:#e6eaf2;--muted:#8b95a7;--accent:#5b8cff;--danger:#ff5d5d}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header.top{display:flex;gap:16px;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line)}
header.top a{color:var(--muted);text-decoration:none}
header.top a:hover{color:var(--text)}
header.top .brand{color:var(--text);font-weight:600;margin-right:auto}
main{max-width:960px;margin:0 auto;padding:24px}
h1{font-size:22px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
label{display:block;color:var(--muted);font-size:13px}
input[type=text]{display:block;width:100%;margin-top:6px;padding:10px 12px;background:#0d1117;border:1px solid var(--line);border-radius:8px;color:var(--text)}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer}
button:hover{filter:brightness(1.1)}
button.danger{background:var(--danger)}
.hint{color:var(--muted);font-size:13px;margin:12px 0 0}
.error{background:#3a1c22;border:1px solid #6b2b35;color:#ffb3b3;padding:12px 14px;border-radius:10px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.avatar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.avatar img{width:100px;height:100px;border-radius:10px;object-fit:cover;background:#0d1117}
.avatar .name{font-size:13px;margin:10px 0 4px;word-break:break-all}
.avatar .meta{color:var(--muted);font-size:12px;margin:0 0 10px}
.empty{color:var(--muted)}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;margin:14px 0}
.drop.hover{border-color:var(--accent);color:var(--text)}
.preview{display:none;margin:0 0 14px}
.preview img{max-width:160px;border-radius:10px;border:1px solid var(--line)}
</style>
</head>
<body>
<header class="top">
  <span class="brand">Avatars</span>
  <a href="/web/upload">Загрузка</a>
  {{if .UserID}}<a href="/web/gallery/{{.UserID}}">Галерея</a>{{end}}
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>{{end}}
