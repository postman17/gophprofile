global:
  resolve_timeout: 5m
route:
  receiver: local
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  # Active alerts are available in the Alertmanager UI. Configure a receiver
  # (email, Slack, webhook) here to deliver notifications outside this stack.
  - name: local
