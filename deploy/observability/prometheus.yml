global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: gophprofile-server
    static_configs:
      - targets: [server:9090]
  - job_name: gophprofile-worker
    static_configs:
      - targets: [worker:9090]
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
  - job_name: spanmetrics
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
