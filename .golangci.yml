version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - nilerr
    - noctx
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gosec
      - path: internal/testutil/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
